# Generated by dl. Every project domain gets a virtual host.
#
# Each host carries a <Directory> block because apache2.conf denies everything outside
# /var/www/ ("<Directory />: Require all denied"), so a document root elsewhere would
# answer 403 while the container starts cleanly. AllowOverride is left alone: the image
# already grants All for /var/www/ through conf-enabled/docker-php.conf.

<VirtualHost *:80>
    ServerName english.localhost
    ServerAlias *.english.localhost
    ServerAlias english.10.0.0.5.nip.io
    ServerAlias *.english.10.0.0.5.nip.io

    DocumentRoot /var/www/html/public-en

    <Directory /var/www/html/public-en>
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName russian.localhost
    ServerAlias *.russian.localhost
    ServerAlias russian.10.0.0.5.nip.io
    ServerAlias *.russian.10.0.0.5.nip.io

    DocumentRoot /var/www/html/public-ru

    <Directory /var/www/html/public-ru>
        Require all granted
    </Directory>
</VirtualHost>

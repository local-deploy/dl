# Generated by dl. Every project domain gets a server block.

server {
    listen 80;
    listen 443;

    # a leading dot matches the domain itself and all of its subdomains
    server_name .mysite.localhost .mysite.10.0.0.5.nip.io;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 200M;

    charset utf-8;

    set $root_path /var/www/html;
    root $root_path;

    location / {
        root $root_path;
        index index.php index.html;
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass mysite_php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;
     }

    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|ogg|otf|pdf|tff|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        expires 365d;
        try_files $uri $uri/ 404 = @fallback;
    }

    location @fallback {
        return 302 https://mysite.localhost/$uri;
    }
}
